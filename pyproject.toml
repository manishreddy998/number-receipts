[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "number-receipts"
version = "0.1.0"
description = "Every number your AI agent says needs a receipt: deterministic checks of numbers in LLM answers against tool outputs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Manish Reddy"}]
dependencies = []
keywords = ["llm", "agents", "hallucination", "evaluation", "guardrails", "tool-calling"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
receipts = "receipts.__main__:main"

[tool.setuptools]
packages = ["receipts"]
